<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Task Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <section class="planner-card mx-auto">
      <header class="text-center mb-4">
        <div class="app-icon">✓</div>
        <h1 class="fw-bold mt-3">Daily Task Planner</h1>
        <p class="text-secondary mb-1">Plan your day, one task at a time.</p>
        <p id="currentDate" class="date-label"></p>
      </header>

      <form id="taskForm" class="input-group mb-3">
        <input id="taskInput" class="form-control" type="text" maxlength="200"
               placeholder="What do you need to do?" aria-label="New task" required>
        <button class="btn btn-primary px-4" type="submit">Add Task</button>
      </form>
      <p id="message" class="small mb-3" aria-live="polite"></p>

      <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Your tasks <span id="taskCount" class="count-badge">0</span></h2>
        <div class="btn-group btn-group-sm" role="group" aria-label="Filter tasks">
          <button type="button" class="btn btn-outline-primary filter-btn active" data-filter="all">All</button>
          <button type="button" class="btn btn-outline-primary filter-btn" data-filter="pending">Pending</button>
          <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
        </div>
      </div>

      <ul id="taskList" class="list-unstyled mb-0"></ul>
      <div id="emptyState" class="empty-state text-center py-5">
        <div class="empty-icon">☀</div>
        <p class="fw-semibold mb-1">No tasks here yet</p>
        <p class="text-secondary small mb-0">Add a task above to get started.</p>
      </div>
      <footer class="text-center text-secondary small mt-4">
        Your tasks are saved in this browser.
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
